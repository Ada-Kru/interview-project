services:
  ministack:
    container_name: ministack_main
    image: ministackorg/ministack:1.5.35-full
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${MINISTACK_PORT:-4566}:4566"
    environment:
      # MiniStack's IAM enforcement is incompatible with the HTTP-only CDK
      # bootstrap bucket policy, so it is opt-in via MINISTACK_AUTH.
      - AUTH=${MINISTACK_AUTH:-false}
      # State is intentionally not persisted: MiniStack only writes service
      # state on a graceful shutdown while S3 data is written continuously, so
      # a restart can leave buckets without their CloudFormation stacks and
      # break `cdk bootstrap`. Each run therefore starts from a clean emulator.
      - MINISTACK_REGION=us-east-1
      - MINISTACK_ACCOUNT_ID=000000000000
      - LOG_LEVEL=INFO
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: interview-project-demo:local
    init: true
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    depends_on:
      ministack:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ENDPOINT_URL_S3: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      CDK_DEFAULT_ACCOUNT: "000000000000"
      CDK_DEFAULT_REGION: us-east-1
      CDK_CLI_TELEMETRY: "false"
      CDK_S3_FORCE_PATH_STYLE: "1"
      CI: "true"
      DEMO_STATE_DIR: /tmp/demo
      DEMO_API_PORT: "8080"
      DATABASE_MODE: local
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    stop_grace_period: 10s
